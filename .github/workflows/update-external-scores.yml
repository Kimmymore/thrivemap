name: Update external scores (GPI + Rainbow Map)

# Runs automatically every year in early July, after both annual releases.
# GPI is published in June by the Institute for Economics & Peace.
# Rainbow Map is published in May by ILGA-Europe.
# Can also be triggered manually from the Actions tab at any time.
#
# `main` has a ruleset that requires the "build" status check, so this workflow
# does NOT push to main directly. Instead it opens a pull request and enables
# auto-merge. The PR triggers the build check in deploy.yml; once it passes,
# the PR merges automatically and the existing deploy job publishes to Pages.
#
# Requirements (one-time setup):
#   * Repo secret DATA_UPDATE_PAT — a fine-grained PAT scoped to this repo with
#     "Contents: Read and write" and "Pull requests: Read and write".
#     A PAT (not GITHUB_TOKEN) is required so the PR actually triggers the
#     "build" check — PRs opened with GITHUB_TOKEN do not trigger workflows.
#   * Settings -> General -> "Allow auto-merge" must be enabled.

on:
  schedule:
    - cron: "0 8 1 7 *"   # 08:00 UTC on 1 July every year
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openpyxl pandas beautifulsoup4 lxml

      - name: Run score updater
        run: python3 scripts/update_external_scores.py
        env:
          EQUALDEX_API_KEY: ${{ secrets.EQUALDEX_API_KEY }}

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DATA_UPDATE_PAT }}
          add-paths: src/data/external-scores.json
          branch: data/external-scores-update
          delete-branch: true
          commit-message: "data: update GPI + Rainbow Map scores"
          title: "data: update GPI + Rainbow Map scores"
          body: |
            Automated annual refresh of GPI (safety) and Rainbow Map (LGBTQ+) scores,
            plus any other sources handled by `scripts/update_external_scores.py`.

            Updates `src/data/external-scores.json`.

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.DATA_UPDATE_PAT }}
        # --squash keeps a clean single commit on main. Change to --merge or
        # --rebase if that method is not enabled for the repository.
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
