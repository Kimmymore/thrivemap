name: Update Equaldex LGBTQ+ scores (weekly)

# Runs every Monday at 03:00 CET (02:00 UTC = cron 0 2 * * 1).
# Note: cron does not adjust for DST — during CEST (summer) this fires at 04:00 CET.
# Can also be triggered manually from the Actions tab at any time.
#
# `main` has a ruleset that requires the "build" status check, so this workflow
# does NOT push to main directly. Instead it opens a pull request and enables
# auto-merge. The PR triggers the build check in deploy.yml; once it passes,
# the PR merges automatically and the existing deploy job publishes to Pages.
#
# Requirements (one-time setup):
#   * Repo secret DATA_UPDATE_PAT — a fine-grained PAT scoped to this repo with
#     "Contents: Read and write" and "Pull requests: Read and write".
#     A PAT (not GITHUB_TOKEN) is required so the PR actually triggers the
#     "build" check — PRs opened with GITHUB_TOKEN do not trigger workflows.
#   * Settings -> General -> "Allow auto-merge" must be enabled.

on:
  schedule:
    - cron: "0 2 * * 1"   # 02:00 UTC Mon = 03:00 CET / 04:00 CEST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-equaldex:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Equaldex data
        run: python3 scripts/update_equaldex.py
        env:
          EQUALDEX_API_KEY: ${{ secrets.EQUALDEX_API_KEY }}

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DATA_UPDATE_PAT }}
          add-paths: src/data/external-scores.json
          branch: data/equaldex-update
          delete-branch: true
          commit-message: "data: update Equaldex LGBTQ+ scores"
          title: "data: update Equaldex LGBTQ+ scores"
          body: |
            Automated weekly Equaldex refresh.

            Updates the `equaldex` key in `src/data/external-scores.json`.
            Source: https://www.equaldex.com (data must not be stored longer than 30 days).

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.DATA_UPDATE_PAT }}
        # --squash keeps a clean single commit on main. Change to --merge or
        # --rebase if that method is not enabled for the repository.
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
