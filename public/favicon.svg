<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pride stripe mark: the same structural rail that runs down the site edge.
       Six flat bars, no gradient and no blur, legible down to 16px. -->
  <rect width="32" height="32" rx="6" fill="#f2ecf4"/>
  <g clip-path="url(#m)">
    <rect x="4"  y="4" width="4" height="24" fill="#e40303"/>
    <rect x="8"  y="4" width="4" height="24" fill="#ff8c00"/>
    <rect x="12" y="4" width="4" height="24" fill="#ffd400"/>
    <rect x="16" y="4" width="4" height="24" fill="#008026"/>
    <rect x="20" y="4" width="4" height="24" fill="#2461ff"/>
    <rect x="24" y="4" width="4" height="24" fill="#8b2fc9"/>
  </g>
  <defs>
    <clipPath id="m"><rect x="4" y="4" width="24" height="24" rx="3"/></clipPath>
  </defs>
</svg>
